[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inter-backend"
version = "0.1.0"
description = "FastAPI backend for Inter Reels"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic==1.19.1",
  "apify-client==3.1.3",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.15.0",
  "sqlmodel==0.0.39",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

