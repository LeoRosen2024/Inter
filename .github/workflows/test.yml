name: Test Inter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inter_test
          POSTGRES_USER: inter
          POSTGRES_PASSWORD: inter-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inter -d inter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://inter:inter-test-password@127.0.0.1:5432/inter_test
      SEED_DEMO_DATA: "false"
      APIFY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[test]"
        working-directory: backend
      - name: Run tests
        run: python -m pytest
        working-directory: backend
      - name: Verify migrations
        run: |
          alembic upgrade head
          alembic check
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: |
          node --check frontend/config.js
          node --check frontend/api.js
          node --check frontend/app.js
      - name: Validate Compose
        run: docker compose config --quiet

